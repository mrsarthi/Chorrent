[package]
name = "chorrent"
description = "Peer-to-peer and swarm file transfer over Iroh/QUIC with verified, chunked downloads"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["p2p", "file-transfer", "iroh", "quic", "swarm"]
categories = ["network-programming", "filesystem"]

[dependencies]
iroh.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
bao-tree.workspace = true
thiserror.workspace = true
blake3.workspace = true
iroh-gossip.workspace = true
serde.workspace = true
postcard = { workspace = true, features = ["alloc"] }
futures-lite.workspace = true
rand.workspace = true
base64.workspace = true
redb.workspace = true
chacha20poly1305.workspace = true
positioned-io.workspace = true
iroh-mainline-address-lookup = { workspace = true, optional = true }

[features]
default = []
# Also publish/look up node addresses on the BitTorrent Mainline DHT, so share
# codes keep reaching a peer after its address changes, without relying only
# on n0's DNS service. Only relay addresses are published, never IPs.
mainline = ["dep:iroh-mainline-address-lookup"]

[package.metadata.docs.rs]
# Document the optional DHT support too.
all-features = true

[dev-dependencies]
tempfile.workspace = true
iroh-gossip.workspace = true
iroh.workspace = true
postcard.workspace = true
tokio = { workspace = true, features = ["full"] }
